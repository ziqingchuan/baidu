<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>popo 动态数据读写验证</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; max-width: 720px; margin: 0 auto; padding: 24px; color: #3a4150; }
  h1 { font-size: 20px; }
  .desc { color: #8a93a5; font-size: 13px; margin-bottom: 16px; }
  .actions { display: flex; gap: 10px; margin-bottom: 16px; }
  button { border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; background: #7aa7f0; color: #fff; }
  button.secondary { background: #eef2f8; color: #3a4150; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 13px; margin-bottom: 12px; }
  .ok { color: #67b26f; }
  .err { color: #e88b7c; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eef1f6; }
  th { color: #8a93a5; font-weight: 500; }
  .empty { color: #a9b0bf; font-size: 13px; padding: 16px 0; }
</style>
</head>
<body>
  <h1>popo 动态数据读写验证</h1>
  <div class="desc">验证 popo 的 Runtime 存储链路：写一条标注测试记录 → 读回列表展示。业务字段在 record.data 里。</div>

  <div class="actions">
    <button id="writeBtn" disabled>写入一条测试记录</button>
    <button id="refreshBtn" disabled class="secondary">刷新列表</button>
  </div>
  <div class="status" id="status">初始化中…</div>

  <table id="list">
    <thead><tr><th>event_key</th><th>分类</th><th>难度</th><th>业务</th><th>创建时间</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="empty" id="empty">暂无记录</div>

<script>
const $ = (id) => document.getElementById(id)
const statusEl = $('status')
const tbody = document.querySelector('#list tbody')
const emptyEl = $('empty')

function setStatus(text, cls = '') {
  statusEl.className = cls ? `status ${cls}` : 'status'
  statusEl.textContent = text
}

async function loadList() {
  try {
    const records = await PopSDK.data.find('event_meta', {
      order: [{ expression: 'created_at DESC' }],
      page: 1,
      pageSize: 50,
    })
    tbody.innerHTML = ''
    for (const r of records) {
      const tr = document.createElement('tr')
      const d = r.data
      tr.innerHTML = `
        <td>${(d.event_key || '').replace(/</g, '&lt;')}</td>
        <td>${(d.category || '').replace(/</g, '&lt;')}</td>
        <td>${d.difficulty ?? ''}</td>
        <td>${(d.business || '').replace(/</g, '&lt;')}</td>
        <td>${new Date(r.createdAt).toLocaleString()}</td>`
      tbody.appendChild(tr)
    }
    emptyEl.style.display = records.length ? 'none' : 'block'
    setStatus(`读取成功，共 ${records.length} 条`, 'ok')
  } catch (e) {
    emptyEl.style.display = 'block'
    setStatus(`读取失败：${e.message || e}`, 'err')
  }
}

async function writeOne() {
  try {
    const key = `trial-${Date.now()}`
    await PopSDK.data.create('event_meta', {
      event_key: key,
      category: '功能实现',
      difficulty: 3,
      business: 'ai-internal',
    })
    setStatus(`写入成功：${key}`, 'ok')
    await loadList()
  } catch (e) {
    setStatus(`写入失败：${e.message || e}`, 'err')
  }
}

async function main() {
  if (!window.PopSDK) {
    setStatus('当前环境没有 PopSDK（本地开发打开会这样），请在 popo 页面上打开本页面验证', 'err')
    return
  }
  try {
    await PopSDK.ready()
    setStatus('PopSDK 就绪，开始读取…', 'ok')
    $('writeBtn').disabled = false
    $('refreshBtn').disabled = false
    await loadList()
  } catch (e) {
    setStatus(`PopSDK 初始化失败：${e.message || e}`, 'err')
  }
}

$('writeBtn').addEventListener('click', writeOne)
$('refreshBtn').addEventListener('click', loadList)
main()
</script>
</body>
</html>
